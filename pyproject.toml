[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "w2w-multidomain-lcz-wrf"
version = "0.1.0"
description = "Domain-native multi-domain LCZ preprocessing for WRF using W2W"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "xarray",
    "netCDF4",
    "h5netcdf",
    "rasterio",
    "rioxarray",
    "tqdm",
    "pyyaml",
    "w2w==0.6.0",
]

[project.optional-dependencies]
test = [
    "pytest",
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
